name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build IPA
        run: |
          xcodebuild \
            -project "LUMINA_EXTERNAL_Reconstruction/LUMINAExternal.xcodeproj" \
            -scheme "LUMINAExternal" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LUMINAExternal.app Payload/
          zip -r LUMINAExternal.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LUMINAExternal-IPA
          path: LUMINAExternal.ipa
